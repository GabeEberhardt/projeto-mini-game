<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Estoura Balões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fundo de céu com duas nuvens fixas -->
  <div class="nuvem"></div>
  <div class="nuvem2"></div>
  <div class="nuvem-movel" id="nuvem-m1"></div>
  <div class="nuvem-movel" id="nuvem-m2"></div>

  <!-- Tela inicial -->
  <div id="tela-inicial">
    <div class="moldura-topo"></div>
    <div class="moldura-baixo"></div>
    <button id="btn-jogar">Começar</button>
    <p class="instrucao">Clique no botão acima para iniciar</p>
  </div>

  <!-- Exibição da pontuação -->
  <div id="pontuacao">Pontuação: 0</div>

  <!-- Exibição das vidas -->
  <div id="vidas">
    <span class="coracao" id="coracao1"></span>
    <span class="coracao" id="coracao2"></span>
    <span class="coracao" id="coracao3"></span>
  </div>

  <!-- Tela de fim de jogo -->
  <div id="tela-fim" style="display:none;">
    <h1>Fim de jogo!</h1>
    <p id="resultado"></p>
    <p id="recorde"></p>
    <p id="novo-recorde" style="display:none;">🎉 Novo recorde! 🎉</p>
    <button id="btn-reiniciar">Jogar novamente</button>
  </div>

  <!-- Lógica do jogo -->
  <script src="script.js"></script>
</body>
</html>
