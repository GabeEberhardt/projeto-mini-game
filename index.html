<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Estoura Balões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fundo de céu com duas nuvens fixas -->
  <div class="nuvem"></div>
  <div class="nuvem2"></div>

  <!-- Tela inicial -->
  <div id="tela-inicial">
    <h1>&#x1F388; Estoure os Balões! &#x1F388;</h1>
    <p>Estoure o máximo de balões que conseguir sem deixar nenhum escapar!</p>
    <button id="btn-jogar">Começar</button>
  </div>

  <!-- Exibição da pontuação -->
  <div id="pontuacao">Pontuação: 0</div>

  <!-- Tela de fim de jogo -->
  <div id="tela-fim" style="display:none;">
    <h1>Fim de jogo!</h1>
    <p id="resultado"></p>
    <button id="btn-reiniciar">Jogar novamente</button>
  </div>

  <!-- Lógica do jogo -->
  <script src="script.js"></script>
</body>
</html>
